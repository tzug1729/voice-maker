<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VOICEVOX 読み上げ</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/parameters.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>VOICEVOX 読み上げ</h1>
    </header>

    <main>
      <form id="form" class="panel" aria-label="音声生成">
        <div class="field">
          <label for="preset">プリセット</label>
          <select id="preset" required>
            <option value="">読み込み中...</option>
          </select>
        </div>

        <section id="parameterPanel" class="parameter-panel" hidden aria-labelledby="parameterTitle">
          <div class="parameter-heading">
            <h2 id="parameterTitle">話者・パラメータ</h2>
            <button id="resetParameters" class="secondary" type="button">保存値に戻す</button>
          </div>
          <div class="field speaker-field">
            <label for="style">話者・スタイル</label>
            <select id="style" disabled>
              <option value="">VOICEVOXから読み込み中...</option>
            </select>
          </div>
          <div class="grid parameter-grid">
            <div class="control"><label for="speedScale">話速 <output id="speedScaleValue"></output></label><input id="speedScale" type="range" min="0.5" max="2" step="0.01"></div>
            <div class="control"><label for="pitchScale">高さ <output id="pitchScaleValue"></output></label><input id="pitchScale" type="range" min="-0.15" max="0.15" step="0.01"></div>
            <div class="control"><label for="intonationScale">抑揚 <output id="intonationScaleValue"></output></label><input id="intonationScale" type="range" min="0" max="2" step="0.01"></div>
            <div class="control"><label for="volumeScale">音量 <output id="volumeScaleValue"></output></label><input id="volumeScale" type="range" min="0" max="2" step="0.01"></div>
            <div class="control"><label for="prePhonemeLength">前の無音（秒） <output id="prePhonemeLengthValue"></output></label><input id="prePhonemeLength" type="range" min="0" max="2" step="0.01"></div>
            <div class="control"><label for="postPhonemeLength">後の無音（秒） <output id="postPhonemeLengthValue"></output></label><input id="postPhonemeLength" type="range" min="0" max="2" step="0.01"></div>
          </div>
          <button id="saveAsPreset" class="secondary save-preset" type="button">現在の設定を新しいプリセットとして保存</button>
        </section>

        <div class="field text-field">
          <div class="field-heading"><label for="text">読み上げる文章</label><span id="count">0 / 500</span></div>
          <textarea id="text" maxlength="500" placeholder="文章を入力" required></textarea>
        </div>

        <div class="form-actions">
          <button id="generate" class="primary" type="submit">音声を生成</button>
          <span>500文字まで</span>
        </div>
        <p id="message" role="status" aria-live="polite"></p>

        <section id="result" class="result" hidden>
          <label for="player">生成した音声</label>
          <audio id="player" controls></audio>
          <a id="download" class="download" download="voice.wav">WAVを保存</a>
        </section>
      </form>

      <section class="panel credit-panel" aria-labelledby="creditTitle">
        <h2 id="creditTitle">クレジット・利用規約</h2>
        <p id="credit">プリセットを選択してください。</p>
        <a id="terms" href="https://voicevox.hiroshiba.jp/term/" target="_blank" rel="noopener noreferrer">音声ライブラリの利用規約</a>
        <p class="fine">音声を公開・配布する場合は、選択した音声ライブラリの利用規約とクレジット表記を確認してください。</p>
      </section>
    </main>

    <footer>
      <span>VOICEVOXを利用しています</span>
      <a href="https://voicevox.hiroshiba.jp/term/" target="_blank" rel="noopener noreferrer">VOICEVOX利用規約</a>
    </footer>
  </div>

  <dialog id="saveDialog" class="save-dialog">
    <form id="savePresetForm" method="dialog">
      <h2>プリセットを保存</h2>
      <label for="newPresetName">プリセット名</label>
      <input id="newPresetName" maxlength="40" placeholder="例: ヒナ（ゆっくり）" required>
      <p id="savePresetMessage" role="status"></p>
      <div class="dialog-actions">
        <button id="cancelSave" class="secondary" type="button">キャンセル</button>
        <button class="primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
